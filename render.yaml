services:
  - type: web
    name: stor1-app
    repo: https://github.com/oliver4441/stor1
    branch: main
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://omix-gateway.kipkiruigideon890.workers.dev
      - key: VITE_OPENCODE_API_KEY
        sync: false
      - key: VITE_ONESIGNAL_APP_ID
        sync: false
