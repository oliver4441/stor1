services:
  - type: web
    name: stor1
    repo: https://github.com/oliver4441/stor1
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_OPENCODE_API_KEY
        sync: false
