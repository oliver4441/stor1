<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="shortcut icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff385c" />
    <title>Omix Store — Your Online Store in Kericho</title>
    <meta name="description" content="Shop online in Kericho, Kenya. Browse products, add to cart, and pay via M-Pesa. Fast delivery to your doorstep." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://xmdyovfcjogkarwxiyhb.supabase.co data:; connect-src 'self' https://xmdyovfcjogkarwxiyhb.supabase.co https://api.supabase.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous" />
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </head>
  <body>
    <div id="root">
      <!-- Loading state shown while JS loads / before React mounts -->
      <div id="initial-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;font-family:system-ui,sans-serif;">
        <div style="width:48px;height:48px;border:4px solid #ff385c;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p style="margin-top:16px;color:#666;font-size:14px;">Loading Omix Store...</p>
        <!-- Trace debug output -->
        <pre id="trace-debug" style="margin-top:24px;padding:16px;background:#f5f5f5;border-radius:8px;font-size:11px;color:#666;max-width:500px;width:90%;max-height:200px;overflow:auto;text-align:left;font-family:monospace;"></pre>
        <noscript>
          <div style="margin-top:24px;padding:24px;max-width:400px;text-align:center;border:2px solid #ef4444;border-radius:16px;background:#fef2f2;">
            <h2 style="color:#dc2626;font-size:18px;margin-bottom:8px;">JavaScript Required</h2>
            <p style="color:#666;font-size:14px;">Omix Store requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
          </div>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // If JS fails to load or crashes, show an error after 10 seconds
      window.__appLoaded = false;
      window.__showFatalError = function(msg) {
        document.getElementById('initial-loader').innerHTML = 
          '<div style="padding:24px;max-width:420px;text-align:center;border:2px solid #ef4444;border-radius:16px;background:#fef2f2;margin:16px;">' +
          '<div style="font-size:40px;margin-bottom:12px;">&#9888;&#65039;</div>' +
          '<h2 style="color:#dc2626;font-size:20px;margin-bottom:8px;">Omix Store failed to load</h2>' +
          '<p style="color:#666;font-size:14px;margin-bottom:16px;">' + (msg || 'An unexpected error occurred.') + '</p>' +
          '<button onclick="window.location.reload()" style="background:#dc2626;color:white;border:none;padding:12px 32px;border-radius:8px;font-size:16px;cursor:pointer;font-weight:bold;">Reload Page</button>' +
          '<p style="color:#999;font-size:12px;margin-top:12px;">If this keeps happening, try clearing your browser cache or using a different browser.</p>' +
          '</div>';
      };
      setTimeout(function() {
        if (!window.__appLoaded) {
          window.__showFatalError('The app took too long to load. This could be a network issue or a browser compatibility problem.');
        }
      }, 15000);
    </script>
  </body>
</html>
