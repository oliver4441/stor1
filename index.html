<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="shortcut icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff385c" />
    <title>Omix Store — Your Online Store in Kericho</title>
    <meta name="description" content="Shop online in Kericho, Kenya. Browse products, add to cart, and pay via M-Pesa. Fast delivery to your doorstep." />
    <script>
      // Permanently force dark mode
      (function() {
        document.documentElement.classList.add('dark');
        // Override localStorage to prevent any theme switching
        var origSetItem = localStorage.setItem.bind(localStorage);
        var origRemoveItem = localStorage.removeItem.bind(localStorage);
        localStorage.setItem = function(key, value) {
          if (key === 'theme') {
            value = 'dark';
          }
          return origSetItem(key, value);
        };
        localStorage.removeItem = function(key) {
          if (key === 'theme') {
            // Don't allow removing theme key
            return;
          }
          return origRemoveItem(key);
        };
        // Also intercept any direct class manipulation on documentElement
        var observer = new MutationObserver(function() {
          document.documentElement.classList.add('dark');
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      })();
    </script>
    <style>
      /* Critical: show loading state immediately */
      #root:empty::before {
        content: 'Loading Omix Store...';
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 18px;
        color: #ff385c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
